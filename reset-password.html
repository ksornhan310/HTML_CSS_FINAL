<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password | Grocery Mart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- Fonts -->
    <link rel="stylesheet" href="./assets/font/stylesheet.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <!-- Scripts -->
    <script src="./assets/js/scripts.js"></script>
</head>

<body>
    <main class="auth">
        <!-- Intro -->
        <div class="auth__intro d-md-none">
            <!-- Logo -->
            <a href="./" class="auth__intro-logo logo d-none d-md-flex">
                <img src="./assets/icons/logo.svg" alt="grocerymart" class="logo__img">
                <h2 class="logo__title">grocerymart</h2>
            </a>
            <img src="./assets/auth/reset_password.png" alt="" class="auth__intro-img">
        </div>

        <!-- Content -->
        <div id="auth-content" class="auth__content show">
            <div class="auth__content-inner">
                <!-- Logo -->
                <a href="./" class="logo">
                    <img src="./assets/icons/logo.svg" alt="grocerymart" class="logo__img">
                    <h2 class="logo__title">grocerymart</h2>
                </a>

                <h1 class="auth__heading">Reset your password</h1>
                <p class="auth__desc ">
                    Enter the email used for your account and we'll send you a link to reset your password.
                </p>

                <div class="message message--success auth__message">
                    The link has been sent, please check your email to reset your password.
                </div>
                <form action="" id="form-reset" class="form auth__form auth__form-reset">
                    <div class="form__group">
                        <div class="form__text-input">
                            <input type="email" name="" id="" placeholder="Email" class="form__input" required>
                            <img src="./assets/icons/message.svg" alt="" class="form__input-icon">
                            <img src="./assets/icons/form-error.svg" alt="" class="form__input-icon--error">
                        </div>
                        <p class="form__error">Email chưa đúng định dạng</p>
                    </div>
                    
                    <div class="form__group auth__btn-group">
                        <button class="btn btn--primary form__submit-btn">Reset password</button>
                    </div>
                </form>

                <p class="auth__text">
                    <a href="./sign-in.html" class="auth__link auth__text-link">Back to Sign In</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        window.dispatchEvent(new Event("template-loaded"));
    </script>
</body>

</html>
