<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create new password | Grocery Mart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- Fonts -->
    <link rel="stylesheet" href="./assets/font/stylesheet.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <!-- Scripts -->
    <script src="./assets/js/scripts.js"></script>
</head>

<body>
    <main class="auth">
        <!-- Intro -->
        <div class="auth__intro d-md-none">
            <!-- Logo -->
            <a href="./" class="auth__intro-logo logo d-none d-md-flex">
                <img src="./assets/icons/logo.svg" alt="grocerymart" class="logo__img">
                <h2 class="logo__title">grocerymart</h2>
            </a>
            <img src="./assets/auth/reset_password.png" alt="" class="auth__intro-img">
        </div>

        <!-- Content -->
        <div id="auth-content" class="auth__content show">
            <div class="auth__content-inner">
                <!-- Logo -->
                <a href="./" class="logo">
                    <img src="./assets/icons/logo.svg" alt="grocerymart" class="logo__img">
                    <h2 class="logo__title">grocerymart</h2>
                </a>

                <h1 class="auth__heading">Create new password</h1>
                <p class="auth__desc">
                    Create a password at least 6 characters long.
                </p>
                <div class="message message--failure auth__message">
                    Passwords do not match
                </div>
                <form action="./sign-in.html" class="form auth__form auth__form-create" id="create-password">
                    <div class="form__group">
                        <div class="form__text-input">
                            <input type="password" name="" id="password" placeholder="Password" class="form__input" required
                                minlength="6">
                            <img src="./assets/icons/lock.svg" alt="" class="form__input-icon">
                            <img src="./assets/icons/form-error.svg" alt="" class="form__input-icon--error">
                        </div>
                        <p class="form__error">Mật khẩu phải có 6 ký tự</p>
                    </div>
                    <div class="form__group">
                        <div class="form__text-input">
                            <input type="password" name="" id="confirm-password" placeholder="Confirm password" class="form__input" required minlength="6">
                            <img src="./assets/icons/lock.svg" alt="" class="form__input-icon">
                            <img src="./assets/icons/form-error.svg" alt="" class="form__input-icon--error">
                        </div>
                        <p class="form__error">Mật khẩu phải có 6 ký tự</p>
                    </div>
                    <div class="form__group auth__btn-group">
                        <button class="btn btn--primary form__submit-btn">Create password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script>
        window.dispatchEvent(new Event("template-loaded"));
    </script>
</body>

</html>
