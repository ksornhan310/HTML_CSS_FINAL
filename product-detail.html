<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Mart</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- Fonts -->
    <link rel="stylesheet" href="./assets/font/stylesheet.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <!-- Scripts -->
    <script src="./assets/js/scripts.js"></script>
</head>

<body>
    <!-- Header -->
    <header id="header" class="header"></header>
    <script>
        load("#header", "./templates/header-loggedin.html");
    </script>

    <!-- Main -->
    <main class="product-page">
        <div class="container">
            <!-- Search bar -->
            <div class="product-container">
                <div class="search-bar d-none d-md-flex">
                    <input type="text" name="" placeholder="Search for item" id="" class="search-bar__input">
                    <button class="search-bar__submit">
                        <img src="./assets/icons/search.svg" alt="" class="search-bar__icon icon">
                    </button>
                </div>
            </div>

            <!-- Breadcrumbs -->
            <div class="product-container">
                <ul class="breadcrumbs">
                    <li class="breadcrumbs__item">
                        <a href="#!" class="breadcrumbs__link">
                            Departments
                            <img src="./assets/icons/arrow-right.svg" alt="" class="breadcrumbs__icon">
                        </a>
                    </li>
                    <li class="breadcrumbs__item">
                        <a href="#!" class="breadcrumbs__link">
                            Coffee
                            <img src="./assets/icons/arrow-right.svg" alt="" class="breadcrumbs__icon">
                        </a>
                    </li>
                    <li class="breadcrumbs__item">
                        <a href="#!" class="breadcrumbs__link">
                            Coffee Beans
                            <img src="./assets/icons/arrow-right.svg" alt="" class="breadcrumbs__icon">
                        </a>
                    </li>
                    <li class="breadcrumbs__item">
                        <a href="#!" class="breadcrumbs__link breadcrumbs__link--current">LavAzza</a>
                    </li>
                </ul>
            </div>

            <!-- Product info -->
            <div class="product-container product-info-container">
                <div class="row">
                    <div class="col-5 col-lg-12">
                        <div class="prod-preview">
                            <div class="prod-preview__list">
                                <div class="prod-preview__item">
                                    <img src="./assets/images/product/product-thumb-1.png" alt=""
                                        class="prod-preview__img">
                                </div>
                                <div class="prod-preview__item">
                                    <img src="./assets/images/product/product-thumb-2.png" alt=""
                                        class="prod-preview__img">
                                </div>
                                <div class="prod-preview__item">
                                    <img src="./assets/images/product/product-thumb-3.png" alt=""
                                        class="prod-preview__img">
                                </div>
                                <div class="prod-preview__item">
                                    <img src="./assets/images/product/product-thumb-4.png" alt=""
                                        class="prod-preview__img">
                                </div>
                            </div>
                            <div class="prod-preview__thumbs d-md-none">
                                <img src="./assets/images/product/product-thumb-1.png" alt=""
                                    class="prod-preview__thumb-img prod-preview__thumb-img--current">
                                <img src="./assets/images/product/product-thumb-2.png" alt=""
                                    class="prod-preview__thumb-img">
                                <img src="./assets/images/product/product-thumb-3.png" alt=""
                                    class="prod-preview__thumb-img">
                                <img src="./assets/images/product/product-thumb-4.png" alt=""
                                    class="prod-preview__thumb-img">
                            </div>
                        </div>
                    </div>
                    <div class="col-7 col-lg-12">
                        <form action="" class="form">
                            <section class="prod-info">
                                <h1 class="prod-info__heading">Coffee Beans - Espresso Arabica and Robusta Beans</h1>
                                <div class="row">
                                    <div class="col-5 col-lg-6 col-md-12">
                                        <div class="prod-property">
                                            <img src="./assets/icons/star.svg" alt="" class="prod-property__icon">
                                            <h4 class="prod-property__title">(3.5) 1100 reviews</h4>
                                        </div>
                                        <label for="" class="form__label prod-info__label">Size/Weight</label>
                                        <div class="filter__form-group">
                                            <div class="form__select-wrap">
                                                <div class="form__select prod-info__select" style="--width: 158px">
                                                    500g
                                                    <img src="./assets/icons/filter-arrow.svg" alt=""
                                                        class="form__select-arrow icon">
                                                </div>
                                                <div class="form__select prod-info__select">
                                                    Gram
                                                    <img src="./assets/icons/filter-arrow.svg" alt=""
                                                        class="form__select-arrow icon">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="filter__form-group">
                                            <div class="form__tags">
                                                <button class="form__tag prod-info__tag">Small</button>
                                                <button class="form__tag prod-info__tag">Medium</button>
                                                <button class="form__tag prod-info__tag">Large</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-7 col-lg-6 col-md-12">
                                        <div class="prod-properties">
                                            <div class="prod-property">
                                                <img src="./assets/icons/document.svg" alt=""
                                                    class="prod-property__icon icon">
                                                <h4 class="prod-property__title">Compare</h4>
                                            </div>
                                            <div class="prod-property">
                                                <img src="./assets/icons/buy.svg" alt="" 
                                                    class="prod-property__icon icon">
                                                <div>
                                                    <h4 class="prod-property__title">Delivery</h4>
                                                    <p class="prod-property__desc">From $6 for 1-3 days</p>
                                                </div>
                                            </div>
                                            <div class="prod-property">
                                                <img src="./assets/icons/bag.svg" alt="" 
                                                    class="prod-property__icon icon">
                                                <div>
                                                    <h4 class="prod-property__title">Pickup</h4>
                                                    <p class="prod-property__desc">Out of 2 store, today</p>
                                                </div>
                                            </div>
                                            <div class="prod-info__card">
                                                <div class="prod-info__row">
                                                    <p class="prod-info__price">$500.00</p>
                                                    <p class="prod-info__tax">10%</p>
                                                </div>
                                                <p class="prod-info__total-price">$540.00</p>
                                                <div class="prod-info__row">
                                                    <button class="btn btn--primary prod-info__btn">Add to cart</button>
                                                    <button class="like-btn prod-info__like-btn">
                                                        <img src="./assets/icons/heart.svg" alt=""
                                                            class="like-btn__icon icon">
                                                        <img src="./assets/icons/red-heart.svg" alt=""
                                                            class="like-btn__icon--liked">
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <!-- Footer -->
    <footer id="footer" class="footer"></footer>
    <script>
        load("#footer", "./templates/footer.html");
    </script>
</body>

</html>
